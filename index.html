<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CYBER STRIKE - 暇つぶしシューティング</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #0d0f18;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
      border: 2px solid #00f0ff;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      cursor: crosshair;
    }
    .hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-family: monospace;
      font-size: 16px;
      font-weight: bold;
      text-shadow: 0 0 8px #00f0ff;
    }
    .instructions {
      margin-top: 10px;
      font-size: 13px;
      color: #8892b0;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="450" height="650"></canvas>
  </div>
  <div class="instructions">
    操作: [マウス / スワイプ / 矢印キー] で移動・自動連射 | [スペース] で緊急ボム
  </div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // --- サウンド生成 (Web Audio API) ---
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'laser') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.1);
    } else if (type === 'hit') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.08);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === 'powerup') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.linearRampToValueAtTime(900, now + 0.2);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    } else if (type === 'bomb') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.6);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.6);
      osc.start(now);
      osc.stop(now + 0.6);
    }
  }

  // --- ゲームステータス ---
  let state = 'TITLE'; // TITLE, PLAYING, GAMEOVER
  let score = 0;
  let highScore = localStorage.getItem('cyber_strike_hi') || 0;
  let frame = 0;
  let shakeTime = 0;

  // --- 入力管理 ---
  const keys = {};
  const pointer = { x: canvas.width / 2, y: canvas.height - 80, active: false };

  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ' && state === 'PLAYING') useBomb();
    if ((state === 'TITLE' || state === 'GAMEOVER') && (e.key === ' ' || e.key === 'Enter')) {
      startGame();
    }
  });
  window.addEventListener('keyup', e => keys[e.key] = false);

  function updatePointer(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    if (e.touches && e.touches[0]) {
      pointer.x = (e.touches[0].clientX - rect.left) * scaleX;
      pointer.y = (e.touches[0].clientY - rect.top) * scaleY;
    } else {
      pointer.x = (e.clientX - rect.left) * scaleX;
      pointer.y = (e.clientY - rect.top) * scaleY;
    }
    pointer.active = true;
  }

  canvas.addEventListener('mousemove', updatePointer);
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); updatePointer(e); }, { passive: false });
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    initAudio();
    if (state !== 'PLAYING') startGame();
    updatePointer(e);
  }, { passive: false });
  canvas.addEventListener('mousedown', () => {
    initAudio();
    if (state !== 'PLAYING') startGame();
  });

  // --- 背景の星 ---
  const stars = Array.from({ length: 60 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    speed: 0.5 + Math.random() * 2,
    size: Math.random() * 2
  }));

  // --- 自機 ---
  const player = {
    x: canvas.width / 2,
    y: canvas.height - 100,
    r: 14,
    hp: 3,
    maxHp: 3,
    bombs: 1,
    power: 1,
    invincible: 0,
    shootCooldown: 0
  };

  let bullets = [];
  let enemyBullets = [];
  let enemies = [];
  let particles = [];
  let items = [];

  function startGame() {
    state = 'PLAYING';
    score = 0;
    frame = 0;
    player.hp = 3;
    player.bombs = 1;
    player.power = 1;
    player.x = canvas.width / 2;
    player.y = canvas.height - 100;
    player.invincible = 60;
    bullets = [];
    enemyBullets = [];
    enemies = [];
    particles = [];
    items = [];
  }

  function useBomb() {
    if (player.bombs <= 0) return;
    player.bombs--;
    playSound('bomb');
    shakeTime = 20;

    // 画面内の敵弾・敵を一掃
    enemyBullets = [];
    enemies.forEach(e => {
      score += e.score;
      createExplosion(e.x, e.y, e.color, 25);
    });
    enemies = [];
  }

  // パーティクル生成
  function createExplosion(x, y, color, count = 12) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 4;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 20 + Math.random() * 15,
        maxLife: 35,
        color,
        size: 2 + Math.random() * 3
      });
    }
  }

  // --- ゲームループ ---
  function update() {
    frame++;

    // 背景星の移動
    stars.forEach(s => {
      s.y += s.speed;
      if (s.y > canvas.height) {
        s.y = 0;
        s.x = Math.random() * canvas.width;
      }
    });

    if (shakeTime > 0) shakeTime--;

    if (state !== 'PLAYING') return;

    // --- 自機操作 ---
    const speed = 5.5;
    if (keys['ArrowLeft'] || keys['a']) player.x -= speed;
    if (keys['ArrowRight'] || keys['d']) player.x += speed;
    if (keys['ArrowUp'] || keys['w']) player.y -= speed;
    if (keys['ArrowDown'] || keys['s']) player.y += speed;

    if (pointer.active) {
      player.x += (pointer.x - player.x) * 0.2;
      player.y += (pointer.y - player.y) * 0.2;
    }

    // 画面内に制限
    player.x = Math.max(player.r, Math.min(canvas.width - player.r, player.x));
    player.y = Math.max(player.r, Math.min(canvas.height - player.r, player.y));

    if (player.invincible > 0) player.invincible--;

    // --- 自機ショット (自動連射) ---
    player.shootCooldown--;
    if (player.shootCooldown <= 0) {
      playSound('laser');
      player.shootCooldown = 8;
      if (player.power === 1) {
        bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -12, p: 1 });
      } else if (player.power === 2) {
        bullets.push({ x: player.x - 8, y: player.y - 12, vx: -0.5, vy: -12, p: 1 });
        bullets.push({ x: player.x + 8, y: player.y - 12, vx: 0.5, vy: -12, p: 1 });
      } else {
        bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -12, p: 1 });
        bullets.push({ x: player.x - 10, y: player.y - 10, vx: -2.5, vy: -11, p: 1 });
        bullets.push({ x: player.x + 10, y: player.y - 10, vx: 2.5, vy: -11, p: 1 });
      }
    }

    // 弾の更新
    bullets.forEach(b => {
      b.x += b.vx;
      b.y += b.vy;
    });
    bullets = bullets.filter(b => b.y > -20 && b.x > 0 && b.x < canvas.width);

    // 敵弾の更新
    enemyBullets.forEach(eb => {
      eb.x += eb.vx;
      eb.y += eb.vy;

      // 自機ヒット判定
      if (player.invincible === 0 && Math.hypot(eb.x - player.x, eb.y - player.y) < player.r + eb.r) {
        hitPlayer();
        eb.dead = true;
      }
    });
    enemyBullets = enemyBullets.filter(eb => !eb.dead && eb.y < canvas.height + 20 && eb.y > -20);

    // --- 敵出現 ---
    const spawnRate = Math.max(25, 60 - Math.floor(score / 500));
    if (frame % spawnRate === 0) {
      const rand = Math.random();
      if (rand < 0.6) {
        // 通常の雑魚
        enemies.push({
          x: 20 + Math.random() * (canvas.width - 40),
          y: -20,
          vx: (Math.random() - 0.5) * 1.5,
          vy: 2 + Math.random() * 2,
          r: 14,
          hp: 2,
          maxHp: 2,
          score: 100,
          color: '#ff3366',
          shootTimer: 999
        });
      } else if (rand < 0.85) {
        // 高速ジグザグ機
        enemies.push({
          x: 20 + Math.random() * (canvas.width - 40),
          y: -20,
          vx: 3,
          vy: 4,
          r: 10,
          hp: 1,
          maxHp: 1,
          score: 150,
          color: '#ffea00',
          shootTimer: 999,
          zigzag: true
        });
      } else {
        // 重装機（弾を撃つ）
        enemies.push({
          x: 40 + Math.random() * (canvas.width - 80),
          y: -30,
          vx: 0,
          vy: 1.2,
          r: 22,
          hp: 7,
          maxHp: 7,
          score: 300,
          color: '#a855f7',
          shootTimer: 45
        });
      }
    }

    // --- 敵の挙動 & 当たり判定 ---
    enemies.forEach(e => {
      e.y += e.vy;
      e.x += e.vx;

      if (e.zigzag) {
        if (e.x < 20 || e.x > canvas.width - 20) e.vx *= -1;
      }

      // 敵の射撃
      if (e.shootTimer !== undefined) {
        e.shootTimer--;
        if (e.shootTimer <= 0) {
          e.shootTimer = 70;
          const angle = Math.atan2(player.y - e.y, player.x - e.x);
          enemyBullets.push({
            x: e.x,
            y: e.y + e.r,
            vx: Math.cos(angle) * 3.5,
            vy: Math.sin(angle) * 3.5,
            r: 4
          });
        }
      }

      // 自機との体当たり判定
      if (player.invincible === 0 && Math.hypot(e.x - player.x, e.y - player.y) < player.r + e.r) {
        hitPlayer();
        e.hp = 0;
      }

      // 弾と敵の接触
      bullets.forEach(b => {
        if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + 5) {
          b.dead = true;
          e.hp -= b.p;
          createExplosion(b.x, b.y, '#fff', 3);
          if (e.hp <= 0) {
            playSound('hit');
            score += e.score;
            createExplosion(e.x, e.y, e.color, 16);

            // アイテムドロップ (15%の確率)
            if (Math.random() < 0.15) {
              const types = ['power', 'bomb', 'heal'];
              const type = types[Math.floor(Math.random() * types.length)];
              items.push({ x: e.x, y: e.y, vy: 1.5, type });
            }
          }
        }
      });
    });

    bullets = bullets.filter(b => !b.dead);
    enemies = enemies.filter(e => e.hp > 0 && e.y < canvas.height + 40);

    // --- アイテム処理 ---
    items.forEach(it => {
      it.y += it.vy;
      if (Math.hypot(it.x - player.x, it.y - player.y) < player.r + 15) {
        it.dead = true;
        playSound('powerup');
        if (it.type === 'power') player.power = Math.min(3, player.power + 1);
        if (it.type === 'bomb') player.bombs = Math.min(3, player.bombs + 1);
        if (it.type === 'heal') player.hp = Math.min(player.maxHp, player.hp + 1);
      }
    });
    items = items.filter(it => !it.dead && it.y < canvas.height + 20);

    // --- パーティクル更新 ---
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
    });
    particles = particles.filter(p => p.life > 0);
  }

  function hitPlayer() {
    player.hp--;
    shakeTime = 12;
    playSound('hit');
    createExplosion(player.x, player.y, '#00f0ff', 20);
    player.invincible = 60;
    if (player.power > 1) player.power--;

    if (player.hp <= 0) {
      state = 'GAMEOVER';
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('cyber_strike_hi', highScore);
      }
    }
  }

  // --- 描画処理 ---
  function draw() {
    ctx.save();

    // 画面揺れ演出
    if (shakeTime > 0) {
      ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
    }

    ctx.fillStyle = '#080911';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 星描画
    ctx.fillStyle = '#fff';
    stars.forEach(s => {
      ctx.globalAlpha = 0.3 + s.speed / 3;
      ctx.fillRect(s.x, s.y, s.size, s.size);
    });
    ctx.globalAlpha = 1.0;

    // 弾描画
    ctx.fillStyle = '#00f0ff';
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#00f0ff';
    bullets.forEach(b => {
      ctx.fillRect(b.x - 2, b.y - 6, 4, 12);
    });

    // 敵弾描画
    ctx.fillStyle = '#ff0055';
    ctx.shadowBlur = 6;
    ctx.shadowColor = '#ff0055';
    enemyBullets.forEach(eb => {
      ctx.beginPath();
      ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // アイテム描画
    items.forEach(it => {
      ctx.shadowBlur = 10;
      let label = 'P';
      if (it.type === 'power') { ctx.fillStyle = '#ffaa00'; ctx.shadowColor = '#ffaa00'; label = 'P'; }
      if (it.type === 'bomb')  { ctx.fillStyle = '#00ffaa'; ctx.shadowColor = '#00ffaa'; label = 'B'; }
      if (it.type === 'heal')  { ctx.fillStyle = '#ff3388'; ctx.shadowColor = '#ff3388'; label = '+'; }

      ctx.beginPath();
      ctx.arc(it.x, it.y, 10, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#000';
      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, it.x, it.y);
    });

    // 敵描画
    enemies.forEach(e => {
      ctx.fillStyle = e.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = e.color;

      ctx.beginPath();
      ctx.moveTo(e.x, e.y + e.r);
      ctx.lineTo(e.x - e.r, e.y - e.r);
      ctx.lineTo(e.x + e.r, e.y - e.r);
      ctx.closePath();
      ctx.fill();

      // ボスクラスのHPバー
      if (e.maxHp > 3) {
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(e.x - 20, e.y - e.r - 8, 40, 4);
        ctx.fillStyle = '#00ffaa';
        ctx.fillRect(e.x - 20, e.y - e.r - 8, 40 * (e.hp / e.maxHp), 4);
      }
    });

    // 自機描画 (無敵時点滅)
    if (state === 'PLAYING' && (player.invincible % 6 < 3)) {
      ctx.fillStyle = '#00f0ff';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#00f0ff';

      ctx.beginPath();
      ctx.moveTo(player.x, player.y - player.r * 1.3);
      ctx.lineTo(player.x - player.r, player.y + player.r);
      ctx.lineTo(player.x, player.y + player.r * 0.5);
      ctx.lineTo(player.x + player.r, player.y + player.r);
      ctx.closePath();
      ctx.fill();

      // エンジンブースターの炎
      ctx.fillStyle = '#ff7700';
      ctx.beginPath();
      ctx.moveTo(player.x - 4, player.y + player.r * 0.7);
      ctx.lineTo(player.x + 4, player.y + player.r * 0.7);
      ctx.lineTo(player.x, player.y + player.r * 1.5 + Math.random() * 6);
      ctx.closePath();
      ctx.fill();
    }

    // パーティクル描画
    particles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 4;
      ctx.shadowColor = p.color;
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1.0;
    ctx.shadowBlur = 0;

    // --- HUD (スコア・残機・ボム) ---
    if (state === 'PLAYING') {
      ctx.fillStyle = '#fff';
      ctx.font = '16px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`SCORE: ${score}`, 15, 25);
      ctx.textAlign = 'right';
      ctx.fillText(`HIGH: ${Math.max(score, highScore)}`, canvas.width - 15, 25);

      // HP表示
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ff3366';
      ctx.fillText(`HP: ${'♥'.repeat(player.hp)}`, 15, canvas.height - 15);

      // ボム表示
      ctx.textAlign = 'right';
      ctx.fillStyle = '#00ffaa';
      ctx.fillText(`BOMB: ${'●'.repeat(player.bombs)}`, canvas.width - 15, canvas.height - 15);
    }

    // --- タイトル / ゲームオーバー画面 ---
    if (state === 'TITLE') {
      drawOverlay('CYBER STRIKE', 'タップまたはスペースキーでスタート');
    } else if (state === 'GAMEOVER') {
      drawOverlay('GAME OVER', `SCORE: ${score} | クリックでリトライ`);
    }

    ctx.restore();
    requestAnimationFrame(() => {
      update();
      draw();
    });
  }

  function drawOverlay(title, subtitle) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#00f0ff';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00f0ff';
    ctx.font = 'bold 36px monospace';
    ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 30);

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = '14px sans-serif';
    ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 20);
  }

  // ループ開始
  update();
  draw();
})();
</script>
</body>
</html>
